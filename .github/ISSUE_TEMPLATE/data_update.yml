name: Catalog or module issue / 目录或模组问题
description: Report missing or incorrect public catalog data / 报告缺失或错误的公共目录数据
title: "[Data] "
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload your roster. Provide only the operator/module name, server, and public source link.

        请勿上传个人练度。只提供干员/模组名称、区服和公开来源链接。
  - type: input
    id: server
    attributes:
      label: Server / 区服
      placeholder: EN / JP / KR
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Operator or module / 干员或模组
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong? / 问题描述
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public evidence URL / 公开证据链接
